/* 布局：固定 16:9 舞台（1920×1080），自动缩放；水彩绘本风：粉彩、纸张、手绘轮廓 */
:root{
  --bg:#efe3c8; --paper:#f6ecd6; --paper2:#fbf3e0; --ink:#6b4a35;
  --display:'ZCOOL KuaiLe','KaiTi','STKaiti','Microsoft YaHei',sans-serif;
  --hand:'Ma Shan Zheng','KaiTi','STKaiti',cursive;
  --body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2b2118;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b2118;color-scheme:dark}
body{background:var(--bg);color:var(--ink)}
</style>
